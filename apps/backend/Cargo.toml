[package]
name = "headcode"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
default-run = "headcode"

# The Vercel Function; `headcode` (src/main.rs) is the CLI and server.
[[bin]]
name = "mcp"
path = "api/mcp.rs"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
http = "1.5.0"
jsonwebtoken = { version = "12.0.0", default-features = false, features = ["aws_lc_rs"] }
postgresql_embedded = { version = "0.22.0", default-features = false, features = ["theseus", "tokio", "tls-rustls-aws-lc-rs"] }
reqwest = { version = "0.13.5", features = ["json"] }
rmcp = { version = "=3.10.0", features = ["server", "transport-streamable-http-server"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "migrate", "macros", "json", "uuid", "chrono"] }
tokio = { version = "1.54.1", features = ["full"] }
tower = "0.5.3"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
url = "2.5.8"
uuid = { version = "1.29.2", features = ["serde"] }
vercel_runtime = { version = "2.4.1", features = ["axum"] }

[profile.release]
strip = true
